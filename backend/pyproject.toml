[project]
name = "amonhen"
version = "0.1.0"
description = "Amon Hen — fire intelligence platform for the full fire management cycle"
requires-python = ">=3.11"

dependencies = [
    # --- API layer -------------------------------------------------------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "geojson-pydantic>=1.1",

    # --- Persistence -----------------------------------------------------
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "geoalchemy2>=0.15",
    "alembic>=1.14",

    # --- Data / science --------------------------------------------------
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "shapely>=2.0",

    # --- Fetching & scheduling -------------------------------------------
    "httpx>=0.27",
    "apscheduler>=3.10",
    "tenacity>=9.0",

    # --- Ops -------------------------------------------------------------
    "structlog>=24.4",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Raster/Earth-observation stack, for Sentinel-2 burned-area mapping and live
# fuel moisture. Kept out of the default image because rasterio carries GDAL,
# by far the heaviest thing this project could depend on, and the entire
# active-response path (detections, clustering, weather, spread, projection)
# works without it. Install it to turn the imagery features on:
#
#     uv pip install -e ".[eo]"
#
# The wheel also needs libexpat at runtime, which python:*-slim does not ship —
# see backend/Dockerfile.
#
# Deliberately just rasterio. An earlier version of this extra also listed
# xarray, rioxarray, netcdf4, odc-stac and pystac-client; none of them is
# imported anywhere. The STAC catalogue is plain JSON over HTTP, which the
# httpx client every other source already uses handles fine, and windowed COG
# reads plus polygonisation are both rasterio's own job. Dropping the other
# five leaves an extra that resolves to just four packages (rasterio plus affine,
# attrs and pyparsing) and costs 165 MB, for no lost function.
eo = [
    "rasterio>=1.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amonhen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
